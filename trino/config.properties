# Single-node install config (mirrors the trinodb/trino image default).
# protocol.v1.alternate-header-name=Presto lets Metabase's bundled
# presto-jdbc driver (X-Presto-* headers) talk to Trino >= 352.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
protocol.v1.alternate-header-name=Presto
