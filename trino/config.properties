# Single-node install config (mirrors the trinodb/trino image default).
# protocol.v1.alternate-header-name=Presto lets Metabase's bundled
# presto-jdbc driver (X-Presto-* headers) talk to Trino >= 352.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# catalog.management was ${ENV:CATALOG_MANAGEMENT}, and that variable was set
# nowhere in the repo. Trino treats an unresolved ${ENV:...} as fatal, so the
# container never booted: `docker compose up` failed on a clean machine and CI's
# readiness loop timed out with no service logs. `static` is the single-node
# value this image ships with and is correct here, so it is now stated outright.
catalog.management=static
protocol.v1.alternate-header-name=Presto
