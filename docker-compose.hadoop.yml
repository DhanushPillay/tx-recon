# Hadoop 3.3.6 YARN+HDFS for tx-recon — zero-cost distributed mode.
#
# overlay: docker compose -f docker-compose.yml -f docker-compose.hadoop.yml up -d
# also with spark standalone: docker compose -f docker-compose.yml -f docker-compose.hadoop.yml -f docker-compose.spark.yml up -d
#
# services: namenode :9870/:8020, 2 datanodes :9864, resourcemanager :8088, 2 nodemanagers :8042/:8043, history :19888
# driver on HOST uses SPARK_MODE=yarn SPARK_MASTER=yarn (see src/common/settings.py for_yarn)
# HADOOP_CONF_DIR must be set for spark-submit --master yarn (see scripts/spark_submit_yarn.sh)
#
# HOSTS one-time (same pattern as spark-master): add to C:\Windows\System32\drivers\etc\hosts
#   127.0.0.1  namenode resourcemanager datanode1 datanode2 minio nessie redpanda spark-master
# verify: curl http://localhost:9870/ , curl http://localhost:8088/cluster , hdfs dfs -ls hdfs://namenode:8020/
#
# memory tuned for 12GB Docker: replication=1, NM 4G, limits 2-4G per service

x-hadoop-image: &hadoop-image apache/hadoop:3.3.6
x-hadoop-image-jdk17: &hadoop-image-jdk17 tx-recon-hadoop:3.3.6-jdk17-py311
x-hadoop-env: &hadoop-env
  HADOOP_HOME: /opt/hadoop
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  CORE-SITE.XML_fs.default.name: hdfs://namenode:8020
  CORE-SITE.XML_hadoop.http.staticuser.user: root
  CORE-SITE.XML_io.file.buffer.size: "131072"
  HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
  HDFS-SITE.XML_dfs.replication: "1"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"
  HDFS-SITE.XML_dfs.namenode.name.dir: file:///tmp/hadoop-root/dfs/name
  HDFS-SITE.XML_dfs.datanode.data.dir: file:///tmp/hadoop-root/dfs/data
  HDFS-SITE.XML_dfs.client.use.datanode.hostname: "true"
  HDFS-SITE.XML_dfs.datanode.use.datanode.hostname: "true"
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  MAPRED-SITE.XML_mapreduce.framework.name: yarn
  MAPRED-SITE.XML_mapreduce.map.env: HADOOP_MAPRED_HOME=$HADOOP_HOME
  MAPRED-SITE.XML_mapreduce.reduce.env: HADOOP_MAPRED_HOME=$HADOOP_HOME
  MAPRED-SITE.XML_yarn.app.mapreduce.am.env: HADOOP_MAPRED_HOME=$HADOOP_HOME
  YARN-SITE.XML_yarn.resourcemanager.hostname: resourcemanager
  YARN-SITE.XML_yarn.nodemanager.aux-services: mapreduce_shuffle
  YARN-SITE.XML_yarn.nodemanager.aux-services.mapreduce_shuffle.class: org.apache.hadoop.mapred.ShuffleHandler
  YARN-SITE.XML_yarn.nodemanager.pmem-check-enabled: "false"
  YARN-SITE.XML_yarn.nodemanager.vmem-check-enabled: "false"
  YARN-SITE.XML_yarn.nodemanager.env-whitelist: JAVA_HOME,HADOOP_COMMON_HOME,HADOOP_HDFS_HOME,HADOOP_CONF_DIR,HADOOP_YARN_HOME,HADOOP_HOME,PATH,LANG,TZ,HADOOP_MAPRED_HOME
  YARN-SITE.XML_yarn.nodemanager.resource.memory-mb: "4096"
  YARN-SITE.XML_yarn.nodemanager.resource.cpu-vcores: "4"
  YARN-SITE.XML_yarn.scheduler.maximum-allocation-mb: "4096"
  YARN-SITE.XML_yarn.nodemanager.vmem-pmem-ratio: "4"
  JDK_JAVA_OPTIONS: "--add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"

services:
  namenode:
    image: *hadoop-image
    platform: linux/amd64
    hostname: namenode
    container_name: namenode
    user: root
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G

  datanode1:
    image: *hadoop-image
    platform: linux/amd64
    hostname: datanode1
    container_name: datanode1
    user: root
    command: ["hdfs", "datanode"]
    environment: *hadoop-env
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode1_data:/tmp/hadoop-root/dfs/data
    ports:
      - "9866:9866"
      - "9867:9867"
      - "9864:9864"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9864/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

  datanode2:
    image: *hadoop-image
    platform: linux/amd64
    hostname: datanode2
    container_name: datanode2
    user: root
    command: ["hdfs", "datanode"]
    environment: *hadoop-env
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - datanode2_data:/tmp/hadoop-root/dfs/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9864/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

  resourcemanager:
    image: *hadoop-image
    platform: linux/amd64
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    environment: *hadoop-env
    ports:
      - "8088:8088"
      - "8030:8030"
      - "8031:8031"
      - "8032:8032"
      - "8040:8040"
      - "8141:8141"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://resourcemanager:8088/cluster || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G

  nodemanager1:
    image: *hadoop-image-jdk17
    platform: linux/amd64
    hostname: nodemanager1
    container_name: nodemanager1
    command: ["yarn", "nodemanager"]
    environment: *hadoop-env
    ports:
      - "8042:8042"
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8042/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 3G

  nodemanager2:
    image: *hadoop-image-jdk17
    platform: linux/amd64
    hostname: nodemanager2
    container_name: nodemanager2
    command: ["yarn", "nodemanager"]
    environment: *hadoop-env
    ports:
      - "8043:8042"
    depends_on:
      resourcemanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8042/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 3G

  historyserver:
    image: *hadoop-image
    platform: linux/amd64
    hostname: historyserver
    container_name: historyserver
    command: ["mapred", "historyserver"]
    environment: *hadoop-env
    ports:
      - "19888:19888"
    depends_on:
      - namenode
      - resourcemanager
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19888/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
