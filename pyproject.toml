[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tx-recon"
version = "0.1.0"
description = "Payment gateway reconciliation with Iceberg MERGE"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "pyspark==3.5.5",
    "pandas>=2.0,<3.0",
    "pandera>=0.18,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "confluent-kafka>=2.0,<3.0",
    "authlib>=1.0.0",
    "apache-airflow==2.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.92.0",
    "polars>=0.20.0",
    "ruff>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
    "mypy>=1.0",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs live Spark + docker services (CI integration job)",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
