[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tx-recon"
version = "0.1.0"
description = "Payment gateway reconciliation with Iceberg MERGE"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "pyspark==4.2.0",
    "pandas>=2.0,<3.0",
    "pandera>=0.18,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "confluent-kafka[schemaregistry]>=2.0,<3.0",
    "authlib>=1.0.0",
    "httpx>=0.26",
    "certifi",
    "fastavro>=1.5.4,<2",
    "apache-airflow==2.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0,<6.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.0",
    "pytest-mock>=3.0",
    "freezegun>=1.0",
    "hypothesis>=6.92.0",
    "polars>=0.20.0",
    "ruff>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
    "mypy>=1.0",
    "mutmut>=3.0",
    "diff-cover>=9.0",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF100"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/performance/**" = ["S311", "S608", "S603", "S110", "SIM105", "B017", "RUF100", "F401", "E402", "S324"]
"src/processing/reconcile.py" = ["S608"]
"src/processing/residual.py" = ["S608"]
"tests/**/test_fee_spark_golden.py" = ["S608"]
"tests/**/test_schema_evolution.py" = ["S608"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs live Spark + docker services (CI integration job)",
    "unit: fast unit tests without docker",
]
addopts = "--cov=src --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.*:",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
