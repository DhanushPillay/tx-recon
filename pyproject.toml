[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tx-recon"
version = "0.1.0"
description = "High-performance local data lakehouse for payment gateway reconciliation"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyspark==3.5.1",
    "confluent-kafka[avro]==2.3.0",
    "pandas>=2.0,<3.0",
    "pandera>=0.18,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "apache-airflow==2.11.2",
    "astronomer-cosmos==1.3.1",
    "dbt-core==1.7.0",
    "dbt-spark[PyHive]==1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-benchmark>=5.0,<6.0",
    "pytest-cov>=5.0,<6.0",
    "chispa==0.9.2",
    "testcontainers>=4.0,<5.0",
    "black==24.2.0",
    "ruff>=0.4,<1.0",
    "pre-commit>=4.0,<5.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring Docker containers (skipped in CI)",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
