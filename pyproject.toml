[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tx-recon"
version = "0.1.0"
description = "Payment gateway reconciliation with Iceberg MERGE"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyspark==3.5.1",
    "pandas>=2.0,<3.0",
    "pandera>=0.18,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "apache-airflow==2.11.2",
    "dbt-core==1.7.0",
    "dbt-spark[PyHive]==1.7.0",
    "iceberg-spark-runtime-3.5_2.12==1.5.0",
    "nessie-spark-extensions-3.5_2.12==0.107.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0,<6.0",
    "chispa==0.9.2",
    "black==24.2.0",
    "ruff>=0.4,<1.0",
    "pre-commit>=4.0,<5.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
