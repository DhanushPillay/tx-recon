name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history: gitleaks scans the push range (base^..head),
          # which does not resolve in a depth-1 clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.11.2" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.11.2/constraints-3.11.txt"
          pip install -e ".[dev]"

      - name: Run Ruff Formatter Check
        run: ruff format --check src/ tests/ dags/

      - name: Run Ruff Linter
        run: ruff check src/ tests/ dags/

      - name: Run Mypy
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          # Blocking: a NEW advisory fails the build. Baseline below pins the
          # 90 advisories accepted on 2026-09-24 (Airflow 2.11.2 tree, pyspark
          # 3.5.1, pytest 8.3.4 — all need upstream upgrades, tracked
          # separately; pyspark 3.5.x bump alone clears PYSEC-2025-184).
          # 2026-09-24 baseline: 37 ignores. 2026-09-25: +53 ignores from local
          # pip-audit (aiohttp 3.13.3, anyio 4.12.1, pyjwt 2.11.0, etc.) — all
          # transitive via airflow constraints, not exploitable in lakehouse
          # batch path (no aiohttp server, no SMTP/FTP data channel, no
          # multipart upload). Review date: 2026-12-24. To add an ignore:
          # append --ignore-vuln ID with dated justification.
          # 2026-09-25: +2 ignores (aiohttp 3.13.3 PYSEC-2026-2109 digest-auth
          # redirect, PYSEC-2026-2111 compressed-body cleanup — both need an
          # aiohttp client/server we never run in the batch path).
          pip-audit --desc \
            --ignore-vuln PYSEC-2023-314 --ignore-vuln PYSEC-2025-184 \
            --ignore-vuln PYSEC-2026-10 --ignore-vuln PYSEC-2026-12 \
            --ignore-vuln PYSEC-2026-13 --ignore-vuln PYSEC-2026-1378 \
            --ignore-vuln PYSEC-2026-1379 --ignore-vuln PYSEC-2026-172 \
            --ignore-vuln PYSEC-2026-173 --ignore-vuln PYSEC-2026-18 \
            --ignore-vuln PYSEC-2026-181 --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-186 --ignore-vuln PYSEC-2026-187 \
            --ignore-vuln PYSEC-2026-2082 --ignore-vuln PYSEC-2026-2083 \
            --ignore-vuln PYSEC-2026-2086 --ignore-vuln PYSEC-2026-2087 \
            --ignore-vuln PYSEC-2026-2088 --ignore-vuln PYSEC-2026-2151 \
            --ignore-vuln PYSEC-2026-2343 --ignore-vuln PYSEC-2026-2344 \
            --ignore-vuln PYSEC-2026-2345 --ignore-vuln PYSEC-2026-2346 \
            --ignore-vuln PYSEC-2026-2351 --ignore-vuln PYSEC-2026-2353 \
            --ignore-vuln PYSEC-2026-2354 --ignore-vuln PYSEC-2026-2356 \
            --ignore-vuln PYSEC-2026-2366 --ignore-vuln PYSEC-2026-3705 \
            --ignore-vuln PYSEC-2026-3706 --ignore-vuln PYSEC-2026-3709 \
            --ignore-vuln PYSEC-2026-3710 --ignore-vuln PYSEC-2026-3711 \
            --ignore-vuln PYSEC-2026-3712 --ignore-vuln PYSEC-2026-3806 \
            --ignore-vuln PYSEC-2026-3966 --ignore-vuln PYSEC-2026-2097 \
            --ignore-vuln PYSEC-2026-2095 --ignore-vuln PYSEC-2026-2098 \
            --ignore-vuln PYSEC-2026-2099 --ignore-vuln PYSEC-2026-2101 \
            --ignore-vuln PYSEC-2026-2100 --ignore-vuln PYSEC-2026-2102 \
            --ignore-vuln PYSEC-2026-2103 --ignore-vuln PYSEC-2026-2094 \
            --ignore-vuln PYSEC-2026-2096 --ignore-vuln PYSEC-2026-2104 \
            --ignore-vuln PYSEC-2026-2105 --ignore-vuln PYSEC-2026-2107 \
            --ignore-vuln PYSEC-2026-2112 --ignore-vuln PYSEC-2026-2110 \
            --ignore-vuln PYSEC-2026-2106 --ignore-vuln PYSEC-2026-2113 \
            --ignore-vuln PYSEC-2026-2108 --ignore-vuln PYSEC-2026-2109 \
            --ignore-vuln PYSEC-2026-2111 --ignore-vuln PYSEC-2026-237 \
            --ignore-vuln PYSEC-2026-3547 --ignore-vuln PYSEC-2026-3546 \
            --ignore-vuln PYSEC-2026-3545 --ignore-vuln PYSEC-2026-2338 \
            --ignore-vuln PYSEC-2026-3805 --ignore-vuln CVE-2026-63374 \
            --ignore-vuln CVE-2026-64847 --ignore-vuln PYSEC-2026-238 \
            --ignore-vuln PYSEC-2026-24 --ignore-vuln PYSEC-2026-215 \
            --ignore-vuln PYSEC-2026-2617 --ignore-vuln PYSEC-2026-1805 \
            --ignore-vuln PYSEC-2026-2987 --ignore-vuln PYSEC-2026-120 \
            --ignore-vuln PYSEC-2026-179 --ignore-vuln PYSEC-2026-175 \
            --ignore-vuln PYSEC-2026-177 --ignore-vuln PYSEC-2026-178 \
            --ignore-vuln PYSEC-2026-176 --ignore-vuln PYSEC-2026-3038 \
            --ignore-vuln PYSEC-2026-3039 --ignore-vuln PYSEC-2026-3040 \
            --ignore-vuln PYSEC-2026-3036 --ignore-vuln PYSEC-2026-3037 \
            --ignore-vuln PYSEC-2026-2275 --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-3697 --ignore-vuln PYSEC-2026-3696 \
            --ignore-vuln PYSEC-2026-3698 --ignore-vuln PYSEC-2026-3699 \
            --ignore-vuln PYSEC-2026-3923 --ignore-vuln PYSEC-2026-141 \
            --ignore-vuln PYSEC-2026-142

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run accuracy gate (sealed harness)
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python tests/performance/quick_perf.py

      - name: Regression gate vs checked-in baseline
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          # Blocking: accuracy match_rate < 85% or >15% throughput / >20% p99
          # movement vs tests/performance/baseline_real.json fails the build.
          # A hardware fingerprint mismatch only warns (CI runners differ).
          python tests/performance/check_regression.py \
            --results tests/performance/results_accuracy.json \
            --baseline tests/performance/baseline_real.json

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "not integration" -n auto --benchmark-disable --cov=src --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90

      - name: Diff coverage on PR (changed lines only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50 || true
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create CI .env
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=password/' .env

      - name: Start Docker Services for Integration Tests
        run: docker compose up -d redpanda minio minio-createbucket nessie trino

      - name: Wait for services to initialize
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T redpanda rpk cluster health 2>/dev/null && break
            sleep 2
          done
          # 403 = bucket exists but needs auth; anything else = keep waiting.
          # `|| true`: curl recv-failure (exit 56) mid-boot must retry, not kill the step under set -e.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/lakehouse/ || true)
            [ "$code" = "403" ] && break
            sleep 2
          done
          # Trino is slow to boot (~2-4 min); /v1/info 200 = coordinator ready
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/info || true)
            [ "$code" = "200" ] && break
            sleep 5
          done

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
          MINIO_ACCESS_KEY: admin
          MINIO_SECRET_KEY: password
        run: |
          pytest tests/ -m "integration" --no-cov --benchmark-disable

  airflow-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # The scheduler image must import src/config/dags; a COPY-less
      # Dockerfile ships an image that cannot run the pipeline.
      - name: Build Airflow image
        run: docker build -f Dockerfile.airflow -t tx-recon-airflow:ci .

  mutation-nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Mutation test fee engine
        run: mutmut run || true

  cloud-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
