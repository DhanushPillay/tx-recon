name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Black Formatter Check
        run: |
          black --check src/ tests/ dags/

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/ dags/

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "not integration" --benchmark-disable --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Start Docker Services for Integration & Benchmarks
        run: docker compose up -d redpanda minio minio-createbucket nessie postgres

      - name: Wait for services to initialize
        run: sleep 15

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "integration"

      - name: Run Performance Benchmarks (Iceberg & Kafka)
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
        run: |
          python tests/performance/run_benchmarks.py --suite all
