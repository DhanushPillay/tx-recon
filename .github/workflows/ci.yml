name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.11.2" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.11.2/constraints-3.11.txt"
          pip install -e ".[dev]"

      - name: Run Ruff Formatter Check
        run: ruff format --check src/ tests/ dags/

      - name: Run Ruff Linter
        run: ruff check src/ tests/ dags/

      - name: Run Mypy
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --desc || true

      - name: Run accuracy gate (sealed harness)
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python tests/performance/quick_perf.py

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "not integration" --benchmark-disable --cov=src --cov-report=term --cov-report=xml --cov-fail-under=70

      - name: Create CI .env
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=password/' .env

      - name: Start Docker Services for Integration Tests
        run: docker compose up -d redpanda minio minio-createbucket nessie

      - name: Wait for services to initialize
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T redpanda rpk cluster health 2>/dev/null && break
            sleep 2
          done
          # 403 = bucket exists but needs auth; anything else = keep waiting
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/lakehouse/)
            [ "$code" = "403" ] && break
            sleep 2
          done

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
          MINIO_ACCESS_KEY: admin
          MINIO_SECRET_KEY: password
        run: |
          pytest tests/ -m "integration"

  cloud-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
