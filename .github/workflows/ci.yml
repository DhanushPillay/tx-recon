name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: gitleaks scans the push range (base^..head),
          # which does not resolve in a depth-1 clone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Lockfile drift
        run: |
          # uv.lock is the record of the resolved set, so gate it. Run
          # `uv lock` locally to refresh. uv itself is pinned because an
          # unpinned resolver silently changes what "frozen" means.
          pip install uv==0.10.6
          uv lock --check

      - name: Install dependencies from the lock
        run: |
          python -m pip install --upgrade pip
          # Install what the lock says, not what PyPI serves today. This step
          # used to check the lock and then ignore it: pip re-resolved from
          # PyPI with no --constraint, so the set pip-audit scanned and the
          # set the tests ran against drifted between runs.
          uv export --frozen --extra dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/ci-requirements.txt"
          pip install -r "$RUNNER_TEMP/ci-requirements.txt"
          # The project itself, editable, with no dependency resolution of its
          # own -- everything it needs is already pinned above.
          pip install -e . --no-deps

      - name: Run Ruff Formatter Check
        run: ruff format --check src/ tests/ dags/ scripts/

      - name: Run Ruff Linter
        run: ruff check src/ tests/ dags/ scripts/

      - name: Run Mypy
        # mypy is a dev extra; installing it again here pulled whatever was
        # newest and overrode the pyproject/lock pin.
        run: mypy src/ --ignore-missing-imports

      - name: Audit baseline is current
        run: |
          # The advisory baseline is a suppression list. Left unenforced it renews
          # itself silently, which is how 40-odd entries ended up with no recorded
          # reason. Expire it.
          review_by=$(grep -oP 'REVIEW_BY=\K[0-9-]+' .github/pip-audit-ignore.txt)
          today=$(date -u +%F)
          if [ "$review_by" \< "$today" ]; then
            echo "::error::pip-audit baseline REVIEW_BY=$review_by has passed (today $today)."
            echo "Re-audit, drop what is fixed, bump the date in .github/pip-audit-ignore.txt."
            exit 1
          fi
          echo "baseline review date $review_by is current"

      - name: Dependency vulnerability scan
        run: |
          # Not a project dependency, so it needs installing -- but pinned, or
          # the audit tool itself floats.
          pip install pip-audit==2.9.0
          # Blocking on anything NOT in the baseline: a new advisory fails the
          # build. Granularity is by advisory ID, so a fresh advisory in an
          # already-ignored package still fails.
          pip-audit --desc \
            $(grep -v '^#' .github/pip-audit-ignore.txt | sed 's/#.*//' | sed 's/[[:space:]]*$//' | grep -v '^$' | sed 's/^/--ignore-vuln /' | xargs)

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run accuracy gate (sealed harness)
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          python tests/performance/quick_perf.py

      - name: Regression gate vs checked-in baseline
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          # This job runs the accuracy harness only, so the gate covers accuracy
          # only. --require makes that explicit: a required family the run does
          # not supply is a failure, not a warning, so the step cannot report
          # success while skipping the metrics it appears to be checking.
          #
          # Throughput, p95 and p99 are covered by benchmark-nightly, which
          # actually produces those artifacts. They were never measured here:
          # the old code warned about the skip and exited 0, so the comment on
          # this step claimed the opposite of what happened.
          #
          # A hardware fingerprint mismatch only warns (CI runners differ).
          # Pass --hardware-policy fail to compare same-host numbers only.
          python tests/performance/check_regression.py \
            --results tests/performance/results_accuracy.json \
            --baseline tests/performance/baseline_real.json \
            --require accuracy

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "not integration" -n auto --benchmark-disable --cov=src --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=90

      - name: Coverage floor on the money path
        run: |
          # The 90% total can hide a gutted core module behind 100%-covered
          # helpers, so the money path gets its own floor.
          coverage report --fail-under=85 --include="src/processing/reconcile.py,src/processing/fee_engine.py,src/processing/residual.py,src/ingestion/ingest_webhooks.py,src/validation/pan_guard.py"

      - name: Diff coverage on PR (changed lines only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50 || true
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create CI .env
        run: |
          cp .env.example .env
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=password/' .env
          # MinIO and the Trino Nessie catalog both run with `password`, but
          # .env.example kept MINIO_SECRET_KEY=change-me. Anything reading
          # credentials through pydantic Settings saw the placeholder while
          # docker-compose passed the real one.
          sed -i 's/^MINIO_SECRET_KEY=.*/MINIO_SECRET_KEY=password/' .env

      - name: Start Docker Services for Integration Tests
        run: docker compose up -d redpanda minio minio-createbucket nessie trino

      # Without this a Trino or Nessie boot failure surfaces as "readiness loop
      # timed out" and nothing else. The logs are the whole diagnosis.
      - name: Service logs on failure
        if: failure()
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 200 || true

      - name: Wait for services to initialize
        run: |
          ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T redpanda rpk cluster health 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "redpanda never became healthy"; docker compose ps; exit 1; }
          # 403 = bucket exists but needs auth; anything else = keep waiting.
          # `|| true`: curl recv-failure (exit 56) mid-boot must retry, not kill the step under set -e.
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/lakehouse/ || true)
            if [ "$code" = "403" ]; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "minio lakehouse bucket never became reachable"; docker compose ps; exit 1; }
          # Nessie serves the Iceberg catalog; /api/v2/config 200 = REST API up
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:19120/api/v2/config || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "nessie api never became ready"; docker compose ps; exit 1; }
          # Trino is slow to boot (~2-4 min); /v1/info 200 = coordinator ready
          ready=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/info || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 5
          done
          [ "$ready" = "1" ] || { echo "trino coordinator never became ready"; docker compose ps; exit 1; }

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          PROJECT_ROOT: ${{ github.workspace }}
          MINIO_ACCESS_KEY: admin
          MINIO_SECRET_KEY: password
        run: |
          pytest tests/ -m "integration" --no-cov --benchmark-disable

  airflow-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The scheduler image must import src/config/dags; a COPY-less
      # Dockerfile ships an image that cannot run the pipeline.
      - name: Build Airflow image
        run: docker build -f Dockerfile.airflow -t tx-recon-airflow:ci .

  mutation-nightly:
    runs-on: ubuntu-latest
    # Nightly + manual only, deliberately not on push/PR: mutmut re-runs the whole
    # selected test set once per mutant, so this is a slow job by construction.
    # The score gate below is what makes it a gate rather than a report.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same lock-driven install as test-and-lint. Mutation results only
          # mean something against the dependency set the tests pass on, so
          # this job used to install differently from the one that runs them.
          pip install uv==0.10.6
          uv lock --check
          uv export --frozen --extra dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/ci-requirements.txt"
          pip install -r "$RUNNER_TEMP/ci-requirements.txt"
          pip install -e . --no-deps

      - name: Mutation test fee engine
        run: mutmut run

      # `mutmut run` writes mutants/mutmut-stats.json, a resume cache with no
      # counts in it. `export-cicd-stats` reads the per-mutant exit codes and
      # writes mutants/mutmut-cicd-stats.json, which does have them. The gate
      # below read the second file while only the first was ever produced.
      - name: Export mutation counts
        run: mutmut export-cicd-stats

      # `mutmut run` exits non-zero on infrastructure failure only, never on a
      # surviving mutant, so the score has to be asserted. The old inline
      # `python -c` referenced MUTATION_SCORE_MIN without a `$`, so Python
      # raised NameError, and it scored a run where every mutant was skipped as
      # 100%. scripts/mutation_score.py fixes both and is unit tested.
      - name: Assert mutation score
        run: python scripts/mutation_score.py --min-score "${MUTATION_SCORE_MIN}"
        env:
          MUTATION_SCORE_MIN: '80'

  cloud-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate
