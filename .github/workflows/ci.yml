name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==2.11.2" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.11.2/constraints-3.10.txt"
          pip install -r requirements.txt
          
      - name: Run Black Formatter Check
        run: |
          black --check src/ tests/ dags/

      - name: Run Ruff Linter
        run: |
          ruff check src/ tests/ dags/

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "not integration" --benchmark-disable --cov=src --cov-report=term --cov-report=xml

      - name: Start Docker Services for Integration Tests
        run: docker compose up -d redpanda minio minio-createbucket nessie postgres

      - name: Wait for services to initialize
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T redpanda rpk cluster health 2>/dev/null && break
            sleep 2
          done

      - name: Run Integration Tests
        env:
          PYTHONPATH: .
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pytest tests/ -m "integration"
