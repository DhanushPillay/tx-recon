version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # AF3 is a migration (sdk imports, constraints-3.x, image bump), not a
    # pin bump: the 3.x meta-package breaks all DAG imports. Re-allow when
    # the migration branch lands.
    ignore:
      - dependency-name: apache-airflow
        versions: [">=3"]
      # Spark 4 needs new jars (3.5.x pinned in config) + Dockerfile base bump;
      # pytest 9 breaks pinned plugin APIs (8.3.4). Both are migrations, not bumps.
      - dependency-name: pyspark
        versions: [">=4"]
      - dependency-name: pytest
        versions: [">=9"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
