# Rates in basis points (1 bps = 0.01%).

version: "v2.0.0"

default:
  mdr_rate_bps: 150  # 1.5%
  gst_on_mdr: 18.0   # 18% GST on the MDR fee
  tolerance_paise: 1  # rounding tolerance

instruments:
  UPI:
    mdr_rate_bps: 0   # UPI is typically zero-fee for merchants
    gst_on_mdr: 0
    notes: "NPC mandates zero MDR on UPI"

  CREDIT_CARD:
    mdr_rate_bps: 200  # 2.0%
    gst_on_mdr: 18.0

  DEBIT_CARD:
    mdr_rate_bps: 100  # 1.0%
    gst_on_mdr: 18.0

  NETBANKING:
    mdr_rate_bps: 150  # 1.5%
    gst_on_mdr: 18.0

  WALLET:
    mdr_rate_bps: 150  # 1.5%
    gst_on_mdr: 18.0

  INTERNATIONAL:
    mdr_rate_bps: 300  # 3.0%
    gst_on_mdr: 18.0

merchants:
  merch_001:
    CREDIT_CARD:
      mdr_rate_bps: 180  # negotiated 1.8% vs 2.0% standard
      gst_on_mdr: 18.0
  merch_demo:
    CREDIT_CARD:
      mdr_rate_bps: 190  # demo merchant slightly better than standard

# Cards picked by settlement_date in [effective_from, effective_to].
history:
  - version: "v1.0.0"
    effective_from: "2024-01-01"
    effective_to: "2025-03-31"
    default:
      mdr_rate_bps: 150
      gst_on_mdr: 18.0
      tolerance_paise: 1
    instruments:
      UPI: {mdr_rate_bps: 0, gst_on_mdr: 0}
      CREDIT_CARD: {mdr_rate_bps: 200, gst_on_mdr: 18.0}
      DEBIT_CARD: {mdr_rate_bps: 100, gst_on_mdr: 18.0}
      NETBANKING: {mdr_rate_bps: 150, gst_on_mdr: 18.0}
      WALLET: {mdr_rate_bps: 150, gst_on_mdr: 18.0}
      INTERNATIONAL: {mdr_rate_bps: 300, gst_on_mdr: 18.0}
    merchants: {}

  - version: "v2.0.0"
    effective_from: "2025-04-01"
    # no effective_to — ongoing
    default:
      mdr_rate_bps: 150
      gst_on_mdr: 18.0
      tolerance_paise: 1
    instruments:
      UPI: {mdr_rate_bps: 0, gst_on_mdr: 0}
      CREDIT_CARD: {mdr_rate_bps: 200, gst_on_mdr: 18.0}
      DEBIT_CARD: {mdr_rate_bps: 100, gst_on_mdr: 18.0}
      NETBANKING: {mdr_rate_bps: 150, gst_on_mdr: 18.0}
      WALLET: {mdr_rate_bps: 150, gst_on_mdr: 18.0}
      INTERNATIONAL: {mdr_rate_bps: 300, gst_on_mdr: 18.0}
    merchants:
      merch_001:
        CREDIT_CARD: {mdr_rate_bps: 180, gst_on_mdr: 18.0}
      merch_demo:
        CREDIT_CARD: {mdr_rate_bps: 190, gst_on_mdr: 18.0}
