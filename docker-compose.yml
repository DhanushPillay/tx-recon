services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: redpanda
    security_opt:
      - no-new-privileges:true
    command:
      - redpanda
      - start
      - --smp 2
      - --memory 2G
      - --reserve-memory 256M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    # 127.0.0.1 on every published port: these services have no
    # authentication of their own (or hold root credentials), and a bare
    # "PORT:PORT" binds 0.0.0.0, i.e. the whole LAN.
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8081:8081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Upstream stopped publishing free MinIO images in October 2025; both
    # Docker Hub and Quay now refuse anonymous pulls. Chainguard rebuilds the
    # same upstream source and publishes it free. Digest-pinned so the tag
    # cannot move under CI.
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    container_name: minio
    security_opt:
      - no-new-privileges:true
    # Chainguard images default to uid 65532, but Docker creates the named
    # volume root-owned. The old upstream image ran as root too, so keep it.
    user: "0:0"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-createbucket:
    # The Chainguard client image has no shell, so the alias comes from
    # MC_HOST_* and the bucket is a single command. restart: on-failure
    # retries until MinIO answers; buckets are private by default.
    image: cgr.dev/chainguard/minio-client@sha256:0d96f662c23c9823874b47b6598cd7352edd9037891cba302d8fd3323dad295b
    depends_on:
      minio:
        condition: service_started
    restart: on-failure
    environment:
      - MC_HOST_myminio=http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}@minio:9000
    entrypoint: ["/usr/bin/mc", "mb", "--ignore-existing", "myminio/lakehouse"]

  nessie:
    image: ghcr.io/projectnessie/nessie:0.107.9-java
    container_name: nessie
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:19120:19120"
    environment:
      - QUARKUS_HTTP_PORT=19120
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19120/api/v2/config || curl -f http://localhost:19120/api/v1/config || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:476
    container_name: trino
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - trino_data:/data/trino
    # Trino resolves ${ENV:...} inside the container (no :-, :? defaults),
    # so the raw values must be present in its environment.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # The trinodb/trino image defaults to -Xmx16G. CI runners are 16 GB and
      # Spark asks for 8g on the same box, so the default heap does not fit
      # alongside anything. 4g is ample for the queries this stack runs.
      JAVA_OPTS: ${TRINO_JAVA_OPTS:--Xmx4G}
    depends_on:
      minio:
        condition: service_started
      nessie:
        condition: service_healthy

  metabase:
    image: metabase/metabase:v0.55.5
    container_name: metabase
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      # 11-card dashboard queries Trino concurrently; 2g still OOMs (exit 139).
      - JAVA_OPTS=-Xmx4g
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - metabase_data:/metabase.db
    depends_on:
      - trino

volumes:
  redpanda_data:
  minio_data:
  trino_data:
  metabase_data:
