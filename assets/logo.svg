<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <!-- Subtle architectural grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E2E8F0" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background Plaque -->
  <rect width="100%" height="100%" fill="#F8F9FA" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <g transform="translate(20, 0)">
    <!-- Piece 1: Bank/Base Data (Deep Navy - representing stability) -->
    <path d="M 64,44 L 96,44 L 96,124 L 136,124 L 136,156 L 64,156 Z" fill="#0B192C" />
    
    <!-- Piece 2: External/Gateway Data (Slate Grey - representing external flow) -->
    <path d="M 104,44 L 176,44 L 176,156 L 144,156 L 144,76 L 104,76 Z" fill="#64748B" />
    
    <!-- Center Block: The Reconciliation Match (Audit Red - representing the verified core) -->
    <rect x="104" y="84" width="32" height="32" fill="#D0342C" />
    
    <!-- Brand Name -->
    <text x="210" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#0B192C" letter-spacing="-2.5">tx-recon</text>
    
    <!-- Brand Subtitle -->
    <text x="216" y="148" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="13" fill="#D0342C" letter-spacing="5">FINANCIAL DATA LAKEHOUSE</text>
  </g>
</svg>
