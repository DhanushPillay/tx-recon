version: 2

sources:
  - name: nessie
    database: nessie
    schema: db
    tables:
      - name: webhooks
        columns:
          - name: transaction_id
            tests:
              - not_null

models:
  - name: stg_webhooks
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: amount_paise
        tests:
          - not_null
      - name: merchant_id
        tests:
          - not_null
      - name: reconciliation_status
        tests:
          - not_null
          - accepted_values:
              values:
                - SUCCESS
                - MATCHED
                - EXCEPTION_FEE_MISMATCH
                - EXCEPTION_NO_WEBHOOK
                - PENDING_SETTLEMENT
                - UNRECONCILED
                - DUPLICATE

  - name: fact_reconciliations
    columns:
      - name: recon_key
        tests:
          - not_null
          - unique
      - name: transaction_date
        tests:
          - not_null
      - name: merchant_id
        tests:
          - not_null
      - name: total_transactions
        tests:
          - not_null
      - name: reconciliation_rate_pct
        tests:
          - not_null

  - name: dim_merchant
    columns:
      - name: merchant_key
        tests:
          - not_null
          - unique
      - name: merchant_id
        tests:
          - not_null
          - unique

  - name: dim_date
    columns:
      - name: date_day
        tests:
          - not_null
          - unique

  - name: dim_instrument
    columns:
      - name: instrument_key
        tests:
          - not_null
          - unique
