  - {tx: j_three_parts, settled_amount_paise: 250, settlement_date: "2025-06-11", instrument_type: UPI, merchant_id: null, currency: INR, bank_ref_id: br_j2b, settlement_id: s_j2b, fee_paise: 0, gst_paise: 0, gross_amount_paise: 250}
  - {tx: j_three_parts, settled_amount_paise: 500, settlement_date: "2025-06-12", instrument_type: UPI, merchant_id: null, currency: INR, bank_ref_id: br_j2c, settlement_id: s_j2c, fee_paise: 0, gst_paise: 0, gross_amount_paise: 500}
  - {tx: j_short, settled_amount_paise: 400, settlement_date: "2025-06-11", instrument_type: UPI, merchant_id: null, currency: INR, bank_ref_id: br_j3a, settlement_id: s_j3a, fee_paise: 0, gst_paise: 0, gross_amount_paise: 400}
  - {tx: j_short, settled_amount_paise: 598, settlement_date: "2025-06-12", instrument_type: UPI, merchant_id: null, currency: INR, bank_ref_id: br_j3b, settlement_id: s_j3b, fee_paise: 0, gst_paise: 0, gross_amount_paise: 598}

  # K: the provider sent the identical line twice. Same amount, same date, same
  # bank reference, different settlement_id -- a redelivery, not an instalment,
  # so it must collapse rather than sum to 195280.
  - {tx: k_redelivery, settled_amount_paise: 97640, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR, bank_ref_id: br_k, settlement_id: s_k_1, fee_paise: 2000, gst_paise: 360, gross_amount_paise: 100000}
  - {tx: k_redelivery, settled_amount_paise: 97640, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR, bank_ref_id: br_k, settlement_id: s_k_2, fee_paise: 2000, gst_paise: 360, gross_amount_paise: 100000}

  # L: the late-SLA sweep only ages rows with no settlement, so both of these
  # reconcile normally however late the money turned up. l_beyond_sla also
  # declares no currency, which is the one missing-currency settlement.
  - {tx: l_within_sla, settled_amount_paise: 97640, settlement_date: "2025-06-04", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR,  bank_ref_id: br_l1, settlement_id: s_l1, fee_paise: 2000, gst_paise: 360, gross_amount_paise: 100000}
  - {tx: l_beyond_sla, settled_amount_paise: 97640, settlement_date: "2025-07-15", instrument_type: CREDIT_CARD, merchant_id: null, currency: null, bank_ref_id: br_l2, settlement_id: s_l2, fee_paise: 2000, gst_paise: 360, gross_amount_paise: 100000}

  # N: 10001 * 200 = 2000200, which is 200.02 paise of fee, so 200. Then
  # 200 * 1800 / 10000 = 36. Net 10001 - 200 - 36 = 9765.
  - {tx: n_frac, settled_amount_paise: 9765, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR, bank_ref_id: br_n1, settlement_id: s_n1, fee_paise: 200, gst_paise: 36, gross_amount_paise: 10001}

# --------------------------------------------------------------------------
# The answer key. `expect_status` is what reconciliation_status must be after
# run_reconciliation. `expect_in_batch` says whether the transaction has a
# settlement row, which decides whether it lands in the batch_ counts or only in
# the table_ counts.
# --------------------------------------------------------------------------
cases:
  - {id: a_upi,  expect_status: MATCHED, expect_in_batch: true,  why: "UPI carries a zero MDR, so the whole 100000 reaches the merchant."}
  - {id: a_cc,   expect_status: MATCHED, expect_in_batch: true,  why: "200 bps on 100000 is 2000, plus 360 of GST, leaves 97640."}
  - {id: a_dc,   expect_status: MATCHED, expect_in_batch: true,  why: "100 bps on 100000 is 1000, plus 180, leaves 98820."}
  - {id: a_nb,   expect_status: MATCHED, expect_in_batch: true,  why: "150 bps on 100000 is 1500, plus 270, leaves 98230."}
  - {id: a_wal,  expect_status: MATCHED, expect_in_batch: true,  why: "Same 150 bps as netbanking, so the same 98230."}
  - {id: a_intl, expect_status: MATCHED, expect_in_batch: true,  why: "300 bps on 100000 is 3000, plus 540, leaves 96460."}

  - {id: b_m1, expect_status: MATCHED, expect_in_batch: true, why: "merch_001 has a negotiated 180 bps on CREDIT_CARD: 1800 + 324 = 97876, which is not the 97640 a merchant off the rate card would see."}
  - {id: b_m2, expect_status: MATCHED, expect_in_batch: true, why: "merch_demo is 190 bps: 1900 + 342 = 97758."}

  - {id: c_v1_last,  expect_status: MATCHED, expect_in_batch: true, why: "2025-03-31 is the last day of v1.0.0 and both cards agree on CREDIT_CARD, so the rate is 200 bps and the date is inside the history."}
  - {id: c_v2_first, expect_status: MATCHED, expect_in_batch: true, why: "2025-04-01 is the first day of v2.0.0 and is inclusive, so no fallback fires."}
  - {id: c_v1_first, expect_status: MATCHED, expect_in_batch: true, why: "2024-01-01 is the first day of v1.0.0, on the zero-fee UPI arm."}
  - {id: c_v2_mid,   expect_status: MATCHED, expect_in_batch: true, why: "An ordinary mid-card date on DEBIT_CARD."}

  - {id: d_near_hi, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "2 paise over the expected net, and tolerance is 1."}
  - {id: d_near_lo, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "3 paise under. The mirror of e_minus_one, which is inside."}
  - {id: d_upi_fee, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "1000 paise missing on an instrument whose MDR is zero, so nothing in the fee model explains the gap."}
  - {id: d_merchant_rate, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "Settled at merch_demo's rate while declared as merch_001, a 118 paisa gap. Proves the merchant arm is being selected at all."}

  - {id: e_minus_one, expect_status: MATCHED, expect_in_batch: true, why: "1 paisa under the net, which is exactly the tolerance."}
  - {id: e_plus_one,  expect_status: MATCHED, expect_in_batch: true, why: "1 paisa over, also inside."}
  - {id: e_exact,     expect_status: MATCHED, expect_in_batch: true, why: "Dead on the net."}

  - {id: f_cc,  expect_status: EXCEPTION_MISSING_WEBHOOK, expect_in_batch: true, why: "No gateway row exists, so the settlement inserts a placeholder."}
  - {id: f_upi, expect_status: EXCEPTION_MISSING_WEBHOOK, expect_in_batch: true, why: "Same, on the zero-fee arm."}
  - {id: f_null_amount, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "The gateway row exists but carries no amount, so there is nothing to compare and the second WHEN MATCHED arm takes it."}

  - {id: g_zero, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "A settlement of 0 against a 1000 paise payment. Only reachable with ALLOW_UNVALIDATED_SETTLEMENT=1, since the validated contract quarantines it, but the MERGE has no reason to call it matched."}
  - {id: g_dust, expect_status: MATCHED, expect_in_batch: true, why: "25 paise gross at 200 bps is exactly 0.5 of a paisa, which rounds away from zero to 1, so the net is 24. Rounding to even would give 25 and a mismatch."}
  - {id: g_tiny, expect_status: MATCHED, expect_in_batch: true, why: "1 paise on a zero-fee arm settles at 1."}

  - {id: h_match, expect_status: MATCHED, expect_in_batch: true, why: "Both sides say INR."}
  - {id: h_diff, expect_status: EXCEPTION_CURRENCY_MISMATCH, expect_in_batch: true, why: "The webhook says INR and the settlement says USD. Before the currency arm existed the two amounts were subtracted as if they shared a unit."}
  - {id: h_webhook_null, expect_status: MATCHED, expect_in_batch: true, why: "The settlement declares INR and the webhook declares nothing. The guard needs both sides to be non-null, so this falls through to the arithmetic. Recorded as a known limitation, not an endorsement."}

  - {id: i_unknown_merchant, expect_status: MATCHED, expect_in_batch: true, why: "m_new has no negotiated rate, so the CREDIT_CARD arm applies at 200 bps. The row reconciles and fee_merchant_unknown_rows counts it."}
  - {id: i_null_merchant, expect_status: MATCHED, expect_in_batch: true, why: "No merchant at all, so the instrument arm applies. The fallback census reads the raw column, so null is not counted as an unknown merchant."}
  - {id: i_unknown_instrument, expect_status: MATCHED, expect_in_batch: true, why: "CRYPTO is outside INSTRUMENT_TYPES, so the card default of 150 bps applies and the net is 98230. Counted in fee_instrument_unknown_rows."}
  - {id: i_out_of_range, expect_status: MATCHED, expect_in_batch: true, why: "2010-01-01 precedes every rate card, so the oldest one applies silently. Counted in fee_card_out_of_range_rows."}
  - {id: i_unparseable_date, expect_status: MATCHED, expect_in_batch: true, why: "to_date('not-a-date') is null, so the newest card applies silently. Counted in fee_card_unparseable_date_rows."}

  - {id: j_two_parts, expect_status: MATCHED, expect_in_batch: true, why: "400 then 600 sums to the 1000 the gateway captured. Before instalments were summed the fold kept 600 and this row could have been marked matched with 400 paise unrecorded."}
  - {id: j_three_parts, expect_status: MATCHED, expect_in_batch: true, why: "250 + 250 + 500, where the two 250 rows differ only in bank_ref_id, so they are instalments rather than a redelivery."}
  - {id: j_short, expect_status: EXCEPTION_FEE_MISMATCH, expect_in_batch: true, why: "400 + 598 is 998 against an expected net of 1000, a 2 paisa gap. Proves the fold sums rather than trusting the latest row."}

  - {id: k_redelivery, expect_status: MATCHED, expect_in_batch: true, why: "The identical line sent twice must collapse to one 97640. Summing it instead would give 195280 and flag the transaction."}

  - {id: l_within_sla, expect_status: MATCHED, expect_in_batch: true, why: "Settled three days after capture, inside the 7 day late SLA."}
  - {id: l_beyond_sla, expect_status: MATCHED, expect_in_batch: true, why: "Settled 45 days after capture. The late-SLA sweep only ages rows with no settlement, so age alone does not demote this one."}

  - {id: m_refund, expect_status: EXCEPTION_REVERSAL, expect_in_batch: false, why: "A refund carries a negative amount, which used to be routed to the DLQ where it could be neither replayed nor purged. It parks here instead, and has no settlement row because the settlement contract still quarantines a negative settled amount."}

  - {id: n_frac, expect_status: MATCHED, expect_in_batch: true, why: "A fee that is not a whole paisa: 200.02 rounds to 200, then 36 of GST, leaving 9765."}

# --------------------------------------------------------------------------
# Batch counters, worked out by hand from the rows above.
# --------------------------------------------------------------------------
expected_counts:
  settlement_rows_total: 45
  settlement_rows_distinct: 44   # the two identical k_redelivery rows collapse
  settlement_rows_deduped: 40    # one row per transaction that has a settlement
  settlement_rows_evaluated: 40  # every one of those has a non-null amount
  duplicate_settlement_rows: 1
  partial_settlement_txns: 3     # j_two_parts, j_three_parts, j_short
  settlement_currency_missing_rows: 1   # l_beyond_sla
  fee_merchant_unknown_rows: 1          # i_unknown_merchant
  fee_card_out_of_range_rows: 1         # i_out_of_range
  fee_card_unparseable_date_rows: 1     # i_unparseable_date
  fee_instrument_unknown_rows: 1        # i_unknown_instrument
  table_EXCEPTION_REVERSAL: 1           # m_refund, the only one of its kind

# --------------------------------------------------------------------------
# Bank evidence, driven through the real build_bank_leg_sql. amount_paise is
# signed the way parse_mt940 now returns it: credits positive, debits negative.
# --------------------------------------------------------------------------
bank:
  lag_days: 2
  settlements:
    - {tx: bank_same_day,      settled_amount_paise: 97640, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR}
    - {tx: bank_late_credit,   settled_amount_paise: 96460, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR}
    - {tx: bank_chargeback,    settled_amount_paise: 50000, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR}
    - {tx: bank_unlinked_debit, settled_amount_paise: 70000, settlement_date: "2025-06-11", instrument_type: CREDIT_CARD, merchant_id: null, currency: INR}
  statements:
    # amount_paise is signed the way parse_mt940 returns it: credits positive,
    # debits negative.
    - {value_date: "2025-06-11", amount_paise:  97640, link_tx: null,                narrative: "SETTLEMENT OF RECEIVABLES"}
    - {value_date: "2025-06-14", amount_paise:  96460, link_tx: null,                narrative: "SETTLEMENT OF RECEIVABLES"}
    - {value_date: "2025-06-11", amount_paise: -50000, link_tx: bank_chargeback,    narrative: "CHARGEBACK REFUND"}
    - {value_date: "2025-06-11", amount_paise: -70000, link_tx: null,                narrative: "CHARGEBACK REVERSAL"}
  expectations:
    bank_same_day: MATCHED
    bank_late_credit: EXCEPTION_MISSING_BANK_STATEMENT
    bank_chargeback: MATCHED
    bank_unlinked_debit: EXCEPTION_MISSING_BANK_STATEMENT
  why:
    bank_same_day: >-
      MATCHED. A credit of 97640 on the settlement date with no link_tx is the
      one shape that counts as independent corroboration: the amount is inside
      tolerance and the value date is inside the lag window.
    bank_late_credit: >-
      EXCEPTION_MISSING_BANK_STATEMENT. The only 96460 credit lands on
      2025-06-14, three days after settlement, and the lag window is two. A
      receipt of the right size arriving too late is not evidence about this
      transaction, which is the whole point of the third leg.
    bank_chargeback: >-
      MATCHED, and not because of the statement line. The chargeback carries
      link_tx = bank_chargeback, so it is attributed to this transaction and its
      magnitude is the exact negative of the 50000 the bank settled. Before the
      debit sign was taken from mt940 that line parsed as +50000 and satisfied
      the same magnitude comparison a credit would, so a chargeback could
      confirm the settlement it was reversing.
    bank_unlinked_debit: >-
      EXCEPTION_MISSING_BANK_STATEMENT. A -70000 line with no link_tx is exactly
      the negative of the settled 70000, so the amount comparison fails by
      140000 paise and nothing corroborates this transaction. Had the sign been
      lost it would have read as a matching +70000 credit on the right date.
