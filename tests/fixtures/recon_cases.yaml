# Reconciliation fixtures with hand-written answers.
#
# The rule this file exists to enforce: no `expect_status` below was produced
# by calling the code under test. Every number was worked out by hand from
# config/fee_rates.yaml and the arithmetic stated in `meta.arithmetic`, and
# every `why` says which branch of the MERGE should fire. If the pipeline and
# this file disagree, one of them is wrong and the file is the one a human can
# check without running anything.
#
# This is the opposite of tests/performance/recon_accuracy.py, which scored
# FeeEngine.check_match against its own output and reported 94.63% -- an
# arithmetic property of the generator's sha256 buckets, not a measurement of
# the fee engine. See tests/test_recon_cases.py.
#
# Boundary note: the bank-evidence cases at the bottom drive the real
# build_bank_leg_sql against temp views, not the MT940 parser. Parsing a .sta
# is covered separately by tests/adapters/test_bank_statement.py; this file
# does not duplicate it.

meta:
  batch_date: "2025-06-10"
  rate_card: "v2.0.0 -- config/fee_rates.yaml, effective_from 2025-04-01, no effective_to"
  arithmetic: >-
    fee_paise = round_half_away_from_zero(gross_paise * mdr_bps / 10000);
    gst_paise = round_half_away_from_zero(fee_paise * 1800 / 10000);
    expected_net = gross_paise - fee_paise - gst_paise.
    MATCHED when ABS(expected_net - settled_amount_paise) <= 1, because no rate
    in this file overrides the card default tolerance of 1 paisa.
  mdr_bps_by_instrument:
    UPI: 0
    CREDIT_CARD: 200
    DEBIT_CARD: 100
    NETBANKING: 150
    WALLET: 150
    INTERNATIONAL: 300
  gst_bps: 1800
  tolerance_paise: 1
  merchant_note: >-
    merchant_id is null on every routine case. config/fee_rates.yaml names only
    merch_001 and merch_demo, so any other id would land in the merchant_unknown
    fallback and bury that counter. A null merchant is a real settlement shape,
    and it falls through to the instrument rate, which is what most cases are
    meant to measure.
  date_note: >-
    Every settlement_date is on or after 2025-04-01 so the v2.0.0 card applies
    cleanly, except where a case exists specifically to probe a date boundary
    or an out-of-range date.

