# kind + spark-operator demo — zero-cost K8s simulation (optional track)
# prereq: kind create cluster --image kindest/node:v1.31.0
# helm repo add spark-operator https://kubeflow.github.io/spark-operator && helm repo update
# helm install spark-operator spark-operator/spark-operator -n spark-operator --create-namespace --wait
# apply: kubectl apply -f k8s/spark-app.yaml && kubectl get sparkapplications --watch
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-nessie-demo
  namespace: default
spec:
  type: Python
  mode: cluster
  image: apache/spark:3.5.1
  imagePullPolicy: IfNotPresent
  sparkVersion: 3.5.1
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkConf:
    spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions"
    spark.sql.catalog.nessie: "org.apache.iceberg.spark.SparkCatalog"
    spark.sql.catalog.nessie.catalog-impl: "org.apache.iceberg.nessie.NessieCatalog"
    spark.sql.catalog.nessie.uri: "http://nessie:19120/api/v2"
    spark.sql.catalog.nessie.ref: "main"
    spark.sql.catalog.nessie.warehouse: "s3a://lakehouse/warehouse"
    spark.sql.catalog.nessie.io-impl: "org.apache.iceberg.aws.s3.S3FileIO"
    spark.sql.catalog.nessie.s3.endpoint: "http://minio:9000"
    spark.sql.catalog.nessie.s3.path-style-access: "true"
    spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0,org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:0.107.5,org.apache.iceberg:iceberg-aws-bundle:1.11.0"
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
  executor:
    cores: 1
    instances: 2
    memory: 1g
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
